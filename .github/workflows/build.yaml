# ============================================================
#  BUILD.YAML - FLUTTER APK BUILDER v3.0.0 (FIXED)
#  AUTO-FIX + ACCEPT SDK LICENSE + CACHE
# ============================================================

name: Build APK

on:
  push:
    branches:
      - build
  workflow_dispatch:
    inputs:
      release_url:
        description: '📥 Download URL (ZIP file)'
        required: false
        type: string
      tag:
        description: '🏷️ Build Tag'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 🔥 FIX: ACCEPT ANDROID SDK LICENSE
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      # ============================================================
      #  FLUTTER BUILD
      # ============================================================
      - name: Setup Flutter SDK
        if: env.type == 'flutter' || github.event.inputs.build_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter project
        if: env.type == 'flutter' || github.event.inputs.build_type == 'flutter'
        run: |
          echo "📦 Preparing Flutter project..."
          
          # Download zip if release_url provided
          if [ -n "${{ github.event.inputs.release_url }}" ]; then
            echo "📥 Downloading from: ${{ github.event.inputs.release_url }}"
            curl -L -o flutter-project.zip "${{ github.event.inputs.release_url }}"
          fi
          
          rm -rf flutter-project
          mkdir -p flutter-project
          
          if [ -f flutter-project.zip ]; then
            unzip -q flutter-project.zip -d flutter-project/
          fi
          
          # 🔥 FIX: FLATTEN STRUCTURE
          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
          
          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            echo "📂 Flattening single root folder..."
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
            rm -rf "$TMP_DIR"
          fi
          
          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "❌ pubspec.yaml not found!"
            find . -name "pubspec.yaml" -type f | head -5
            exit 1
          fi
          
          echo "✅ Project prepared"
          ls -la flutter-project/

      - name: Auto-Fix pubspec.yaml
        if: env.type == 'flutter' || github.event.inputs.build_type == 'flutter'
        run: |
          cd flutter-project
          
          echo "🔧 Auto-fixing pubspec.yaml..."
          
          # Fix SDK constraint
          sed -i 's/sdk: ">=3.0.0 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          sed -i 's/sdk: ^3.[0-9].[0-9]/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          sed -i 's/sdk: ">=3.[0-9].[0-9] <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          
          # Fix common packages
          sed -i 's/webview_flutter: ^[0-9]*\.[0-9]*\.[0-9]*/webview_flutter: ^4.13.0/g' pubspec.yaml
          sed -i 's/geolocator: ^[0-9]*\.[0-9]*\.[0-9]*/geolocator: ^13.0.4/g' pubspec.yaml
          sed -i 's/google_maps_flutter: ^[0-9]*\.[0-9]*\.[0-9]*/google_maps_flutter: ^2.9.0/g' pubspec.yaml
          sed -i 's/permission_handler: ^[0-9]*\.[0-9]*\.[0-9]*/permission_handler: ^11.3.1/g' pubspec.yaml
          sed -i 's/firebase_core: ^[0-9]*\.[0-9]*\.[0-9]*/firebase_core: ^2.32.0/g' pubspec.yaml
          sed -i 's/file_picker: ^[0-9]*\.[0-9]*\.[0-9]*/file_picker: ^6.2.1/g' pubspec.yaml
          sed -i 's/image_picker: ^[0-9]*\.[0-9]*\.[0-9]*/image_picker: ^1.1.2/g' pubspec.yaml
          sed -i 's/flutter_local_notifications: ^[0-9]*\.[0-9]*\.[0-9]*/flutter_local_notifications: ^17.2.4/g' pubspec.yaml
          sed -i 's/workmanager: ^[0-9]*\.[0-9]*\.[0-9]*/workmanager: ^0.5.2/g' pubspec.yaml
          
          echo "✅ pubspec.yaml auto-fixed"
          cat pubspec.yaml | grep -E "sdk:|webview_flutter:|geolocator:" || echo "⚠️ No matching deps"

      - name: Flutter Pub Get with Retry
        if: env.type == 'flutter' || github.event.inputs.build_type == 'flutter'
        run: |
          cd flutter-project
          
          echo "📦 Running flutter pub get..."
          
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5..."
            if flutter pub get; then
              echo "✅ flutter pub get succeeded!"
              break
            fi
            echo "⚠️ flutter pub get failed, retrying in 5 seconds..."
            rm -rf pubspec.lock
            sleep 5
          done
          
          # Second attempt to ensure all dependencies
          echo "📦 Running flutter pub get again..."
          flutter pub get

      - name: Build Flutter APK
        if: env.type == 'flutter' || github.event.inputs.build_type == 'flutter'
        run: |
          cd flutter-project
          
          echo "🔨 Building Flutter APK..."
          
          # 🔥 BUILD DENGAN OPTIMASI
          flutter build apk --release --no-tree-shake-icons

      - name: Collect APK - FIXED
        if: always()
        run: |
          echo "📦 Collecting APK..."
          
          mkdir -p output
          
          # 🔥 CARI APK DI SEMUA LOKASI
          APK_PATHS=(
            "flutter-project/build/app/outputs/apk/release/app-release.apk"
            "flutter-project/build/app/outputs/apk/debug/app-debug.apk"
            "flutter-project/build/app/outputs/flutter-apk/app-release.apk"
            "flutter-project/build/app/outputs/flutter-apk/app-debug.apk"
            "flutter-project/app/build/outputs/apk/release/app-release.apk"
            "flutter-project/app/build/outputs/apk/debug/app-debug.apk"
            "project/build/app/outputs/apk/release/app-release.apk"
            "project/build/app/outputs/apk/debug/app-debug.apk"
          )
          
          FOUND=false
          for APK_PATH in "${APK_PATHS[@]}"; do
            if [ -f "$APK_PATH" ]; then
              echo "✅ APK found at: $APK_PATH"
              cp "$APK_PATH" "output/app.apk"
              echo "✅ APK saved: output/app.apk"
              FOUND=true
              break
            fi
          done
          
          # 🔥 JIKA TIDAK DITEMUKAN, CARI SEMUA .apk
          if [ "$FOUND" = false ]; then
            echo "⚠️ APK not found in standard paths, searching all..."
            find . -name "*.apk" -type f 2>/dev/null | while read -r apk; do
              echo "📱 Found APK: $apk"
              cp "$apk" "output/app.apk"
              FOUND=true
              break
            done
          fi
          
          if [ "$FOUND" = false ]; then
            echo "❌ No APK found!"
            echo "📂 Directory structure:"
            find . -type d | head -30
            exit 1
          fi
          
          echo "📂 Output:"
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: output/*.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Notify Success
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    🎉 BUILD SUCCESSFUL 🎉                      ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📱 APK ready in artifacts"

      - name: Notify Failure
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    ❌ BUILD FAILED ❌                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔗 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

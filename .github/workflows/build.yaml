name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Release URL (ZIP)'
        required: true
        type: string
      tag:
        description: 'Build Tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      #  SETUP JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # ============================================================
      #  SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      # ============================================================
      #  SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        run: |
          echo "y" | sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          echo "y" | sdkmanager --install "cmdline-tools;latest"
          echo "y" | sdkmanager --install "platform-tools"
          echo "y" | sdkmanager --update
        env:
          ANDROID_SDK_ROOT: /usr/local/android-sdk

      # ============================================================
      #  DOWNLOAD & EXTRACT PROJECT
      # ============================================================
      - name: Download Project ZIP
        run: |
          echo "📥 Downloading from: ${{ inputs.release_url }}"
          curl -L -o project.zip "${{ inputs.release_url }}"
          ls -la project.zip

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o project.zip -d project/
          ls -la project/

      # ============================================================
      #  FIX GRADLE & ANDROID CONFIG
      # ============================================================
      - name: Fix Gradle Properties
        run: |
          if [ -f "project/android/gradle.properties" ]; then
            cat >> project/android/gradle.properties << 'EOF'
          
          # ============================================================
          #  FIXED GRADLE CONFIG
          # ============================================================
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8=true
          android.enableDexingArtifactTransform=true
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
          else
            mkdir -p project/android
            cat > project/android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

      - name: Fix Android Gradle Build
        run: |
          # Fix build.gradle jika ada
          if [ -f "project/android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' project/android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' project/android/app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' project/android/app/build.gradle
          fi

      - name: Fix Android Manifest
        run: |
          if [ -f "project/android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' project/android/app/src/main/AndroidManifest.xml
            sed -i 's/android:hardwareAccelerated="false"/android:hardwareAccelerated="true"/g' project/android/app/src/main/AndroidManifest.xml
          fi

      # ============================================================
      #  BUILD APK
      # ============================================================
      - name: Flutter Clean
        run: |
          cd project
          flutter clean || true

      - name: Flutter Pub Get
        run: |
          cd project
          flutter pub get --no-example

      - name: Flutter Build APK
        run: |
          cd project
          flutter build apk --release --split-per-abi --no-tree-shake-icons
        env:
          ANDROID_SDK_ROOT: /usr/local/android-sdk

      # ============================================================
      #  COLLECT APK
      # ============================================================
      - name: Collect APK Files
        run: |
          mkdir -p output
          echo "🔍 Looking for APK files..."
          
          # Cari semua APK
          find . -name "*.apk" -type f -exec cp -v {} output/ \;
          
          echo "📦 APK found:"
          ls -la output/

      - name: List APK Details
        run: |
          echo "📋 APK Details:"
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              size=$(du -h "$apk" | cut -f1)
              name=$(basename "$apk")
              echo "  📱 $name - $size"
            fi
          done

      # ============================================================
      #  UPLOAD ARTIFACT
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: output/
          retention-days: 7
          if-no-files-found: error

      # ============================================================
      #  SEND TO TELEGRAM (Optional)
      # ============================================================
      - name: Send Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build SUCCESS!"
          else
            echo "❌ Build FAILED!"
            exit 1
          fi

      # ============================================================
      #  CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf project.zip project/ || true
          echo "🧹 Cleanup completed!"

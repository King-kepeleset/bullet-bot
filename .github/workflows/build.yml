name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Direct Download URL (link ke ZIP file)'
        required: true
        type: string
      tag:
        description: 'Build Tag'
        required: true
        type: string
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📥 Download Project ZIP
        run: |
          echo "📥 Downloading from: ${{ inputs.release_url }}"
          echo "🔍 Testing URL with curl..."
          
          curl -I -L "${{ inputs.release_url }}" 2>&1 | head -10
          
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5..."
            
            wget --timeout=60 --tries=1 --progress=dot:giga \
              -O project.zip "${{ inputs.release_url }}" || true
            
            if [ -f "project.zip" ] && [ -s "project.zip" ]; then
              echo "✅ Download successful! Size: $(du -h project.zip | cut -f1)"
              break
            fi
            
            echo "⚠️ Download failed, retrying in 5 seconds..."
            sleep 5
          done
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ Failed to download project.zip after 5 attempts"
            echo "📂 Current directory contents:"
            ls -la
            exit 1
          fi
          
          echo "📂 Extracting ZIP..."
          unzip -q project.zip -d project/ || {
            echo "❌ Failed to extract ZIP file"
            exit 1
          }
          
          echo "📂 Project files:"
          ls -la project/

      - name: 🔍 Check Project Structure
        run: |
          echo "📂 Checking project structure..."
          
          if [ -f "project/pubspec.yaml" ]; then
            echo "✅ pubspec.yaml found"
            cat project/pubspec.yaml | head -20
          else
            echo "⚠️ pubspec.yaml not found in root, searching..."
            find project -name "pubspec.yaml" -type f | head -5
            echo "❌ pubspec.yaml not found, exiting..."
            exit 1
          fi
          
          if [ -f "project/android/app/build.gradle" ]; then
            echo "✅ android/app/build.gradle found"
          else
            echo "⚠️ android/app/build.gradle not found"
          fi

      - name: 🔧 Setup Gradle Wrapper
        run: |
          if [ ! -f "project/android/gradlew" ]; then
            echo "⚠️ gradlew not found, creating..."
            cd project/android
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            chmod +x gradlew
            cd ../..
          else
            chmod +x project/android/gradlew
          fi

      - name: 📦 Flutter Pub Get
        run: |
          cd project
          flutter pub get
          echo "✅ Flutter dependencies installed"

      - name: 🔨 Build APK
        run: |
          cd project
          echo "🔨 Building ${{ inputs.build_mode }} APK..."
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release --no-tree-shake-icons
          else
            flutter build apk --debug --no-tree-shake-icons
          fi
          echo "✅ Build completed!"

      - name: 📦 Collect APK
        run: |
          mkdir -p output
          APK_DIR="project/build/app/outputs/apk"
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            APK_PATH="$APK_DIR/release/app-release.apk"
          else
            APK_PATH="$APK_DIR/debug/app-debug.apk"
          fi
          
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "output/app-${{ inputs.tag }}.apk"
            echo "✅ APK saved: app-${{ inputs.tag }}.apk"
            ls -la output/
          else
            echo "❌ APK not found at expected path: $APK_PATH"
            echo "📂 Searching for APK files..."
            find project -name "*.apk" -type f 2>/dev/null || echo "No APK found"
            exit 1
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 7

      - name: ✅ Notify Success
        run: |
          echo "🎉 Build successful for tag: ${{ inputs.tag }}"
          echo "📦 APK available in artifacts"

      - name: ❌ Notify Failure
        if: failure()
        run: |
          echo "❌ Build failed for tag: ${{ inputs.tag }}"
          echo "🔗 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"        uses: subosito/flutter-action@v2

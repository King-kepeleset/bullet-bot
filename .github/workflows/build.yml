name: Build APK - Unified

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'Project Type'
        required: true
        default: 'web2apk'
        type: choice
        options:
          - web2apk
          - flutter
          - native
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'SyncXxX'
      package_name:
        description: 'Package Name (com.xxx.xxx)'
        required: true
        default: 'com.example.app'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code (angka)'
        required: true
        default: '1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      website_url:
        description: 'URL Website (khusus web2apk)'
        required: false
        default: 'https://example.com'
      chat_id:
        description: 'Telegram Chat ID (opsional, kosongkan jika tidak perlu)'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token (opsional, kosongkan jika tidak perlu)'
        required: false
        default: ''
  push:
    branches:
      - build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      # ============================================================
      # 1. TENTUKAN KONFIGURASI (input / build-config.json / default)
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build configuration
        id: cfg
        run: |
          set -e
          if [ -n "${{ inputs.project_type }}" ]; then
            echo "PROJECT_TYPE=${{ inputs.project_type }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ inputs.app_name }}"             >> $GITHUB_ENV
            echo "PACKAGE_NAME=${{ inputs.package_name }}"     >> $GITHUB_ENV
            echo "VERSION_NAME=${{ inputs.version_name }}"     >> $GITHUB_ENV
            echo "VERSION_CODE=${{ inputs.version_code }}"     >> $GITHUB_ENV
            echo "BUILD_TYPE=${{ inputs.build_type }}"         >> $GITHUB_ENV
            echo "WEBSITE_URL=${{ inputs.website_url }}"       >> $GITHUB_ENV
            echo "CHAT_ID=${{ inputs.chat_id }}"               >> $GITHUB_ENV
            echo "BOT_TOKEN=${{ inputs.bot_token }}"           >> $GITHUB_ENV
          elif [ -f build-config.json ]; then
            echo "PROJECT_TYPE=$(jq -r '.type // "web2apk"' build-config.json)"       >> $GITHUB_ENV
            echo "APP_NAME=$(jq -r '.app_name // "MyApp"' build-config.json)"         >> $GITHUB_ENV
            echo "PACKAGE_NAME=$(jq -r '.package_name // "com.web2apk.app"' build-config.json)" >> $GITHUB_ENV
            echo "VERSION_NAME=$(jq -r '.version_name // "1.0"' build-config.json)"   >> $GITHUB_ENV
            echo "VERSION_CODE=$(jq -r '.version_code // "1"' build-config.json)"     >> $GITHUB_ENV
            echo "BUILD_TYPE=$(jq -r '.build_type // "release"' build-config.json)"   >> $GITHUB_ENV
            echo "WEBSITE_URL=$(jq -r '.url // "https://example.com"' build-config.json)" >> $GITHUB_ENV
            echo "CHAT_ID=$(jq -r '.chat_id // ""' build-config.json)"                >> $GITHUB_ENV
            echo "BOT_TOKEN=$(jq -r '.bot_token // ""' build-config.json)"            >> $GITHUB_ENV
          else
            echo "PROJECT_TYPE=native"     >> $GITHUB_ENV
            echo "APP_NAME=SyncXxX"        >> $GITHUB_ENV
            echo "PACKAGE_NAME=com.example.app" >> $GITHUB_ENV
            echo "VERSION_NAME=1.0.0"      >> $GITHUB_ENV
            echo "VERSION_CODE=1"          >> $GITHUB_ENV
            echo "BUILD_TYPE=release"      >> $GITHUB_ENV
            echo "WEBSITE_URL=https://example.com" >> $GITHUB_ENV
            echo "CHAT_ID="                >> $GITHUB_ENV
            echo "BOT_TOKEN="              >> $GITHUB_ENV
          fi
          echo "========== KONFIGURASI =========="
          echo "Type    : $PROJECT_TYPE"
          echo "App     : $APP_NAME"
          echo "Package : $PACKAGE_NAME"
          echo "Version : $VERSION_NAME (+$VERSION_CODE)"
          echo "Build   : $BUILD_TYPE"
          echo "===================================="

      # ============================================================
      # 2. NOTIFY START (opsional)
      # ============================================================
      - name: Notify Start (Telegram)
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⏳ <b>Build dimulai!</b>

          🏷️ App: <code>${APP_NAME}</code>
          📦 Package: <code>${PACKAGE_NAME}</code>
          🔢 Versi: <code>${VERSION_NAME}</code>+<code>${VERSION_CODE}</code>
          🔨 Tipe: <code>${BUILD_TYPE}</code>
          🧩 Jenis: <code>${PROJECT_TYPE}</code>" || true

      # ============================================================
      # 3. SETUP ENVIRONMENT
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools (ImageMagick, jq, unzip, curl, Pillow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq unzip curl
          pip install -q Pillow

      - name: Generate keystore for signing
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ============================================================
      # 4A. NATIVE BUILD (android/ folder sudah ada)
      # ============================================================
      - name: Generate App Icons (native)
        if: env.PROJECT_TYPE == 'native'
        run: |
          if [ -f generate_icons.py ]; then
            python3 generate_icons.py || true
          fi

      - name: Patch AndroidManifest.xml (native)
        if: env.PROJECT_TYPE == 'native'
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            OLD_PKG=$(grep -oP '(?<=package=")[^"]+' "$MANIFEST" | head -1 || true)
            if [ -n "$OLD_PKG" ]; then
              sed -i "s|$OLD_PKG|${PACKAGE_NAME}|g" "$MANIFEST"
            fi
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${APP_NAME}\"|g" "$MANIFEST"
          fi

      - name: Patch build.gradle (native)
        if: env.PROJECT_TYPE == 'native'
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s|applicationId \"[^\"]*\"|applicationId \"${PACKAGE_NAME}\"|" "$GRADLE"
            sed -i "s|versionCode [0-9]*|versionCode ${VERSION_CODE}|" "$GRADLE"
            sed -i "s|versionName \"[^\"]*\"|versionName \"${VERSION_NAME}\"|" "$GRADLE"
          fi

      - name: Patch strings.xml (native)
        if: env.PROJECT_TYPE == 'native'
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|g" "$STRINGS"
          fi

      - name: Setup Gradle Wrapper (native)
        if: env.PROJECT_TYPE == 'native'
        run: |
          if [ ! -f android/gradlew ]; then
            echo "❌ android/gradlew tidak ditemukan"; exit 1
          fi
          chmod +x android/gradlew
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p android/gradle/wrapper
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Build APK (native)
        if: env.PROJECT_TYPE == 'native'
        run: |
          set -e
          cd android
          if [ "${BUILD_TYPE}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # ============================================================
      # 4B. WEB2APK BUILD (generate project Android dari URL)
      # ============================================================
      - name: Web2APK - Create root gradle files
        if: env.PROJECT_TYPE == 'web2apk'
        run: |
          set -e
          mkdir -p project
          cat > project/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle
        if: env.PROJECT_TYPE == 'web2apk'
        run: |
          set -e
          mkdir -p project/app
          cat > project/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java sources
        if: env.PROJECT_TYPE == 'web2apk'
        run: |
          set -e
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle(getString(R.string.app_name));
                  }
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("intent:") || url.startsWith("whatsapp:")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          progressBar.setProgress(progress);
                          progressBar.setVisibility(progress >= 100 ? View.GONE : View.VISIBLE);
                      }
                  });
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, contentDisposition);
                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          dm.enqueue(request);
                      }
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); return; }
                  super.onBackPressed();
              }
              @Override protected void onResume() { if (webView != null) webView.onResume(); }
              @Override protected void onPause()  { if (webView != null) webView.onPause(); super.onPause(); }
              @Override protected void onDestroy(){ if (webView != null) webView.destroy(); super.onDestroy(); }
          }
          EOF
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<'EOF'
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              private static final int SPLASH_DELAY = 1800;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                  }, SPLASH_DELAY);
              }
          }
          EOF

      - name: Web2APK - Create manifest and resources
        if: env.PROJECT_TYPE == 'web2apk'
        run: |
          set -e
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity android:name=".SplashActivity" android:exported="true" android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#000000"
                  app:titleTextColor="#FFFFFF"/>
              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF
          cat > project/app/src/main/res/layout/activity_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_centerInParent="true" android:gravity="center" android:orientation="vertical">
                  <ImageView android:id="@+id/splashLogo"
                      android:layout_width="120dp" android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView android:id="@+id/splashAppName"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="@string/app_name" android:textSize="26sp"
                      android:textStyle="bold" android:textColor="#FFFFFF" android:layout_marginTop="20dp" />
                  <ProgressBar android:id="@+id/splashProgress"
                      android:layout_width="40dp" android:layout_height="40dp" android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat > project/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppName</string>
              <string name="loading">Loading...</string>
          </resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Web2APK - Apply URL, name, icons, package, version, keystore
        if: env.PROJECT_TYPE == 'web2apk'
        run: |
          set -e
          sed -i "s|URL_PLACEHOLDER|${WEBSITE_URL}|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|g" project/app/src/main/res/values/strings.xml
          sed -i "s|applicationId \"com.web2apk.app\"|applicationId \"${PACKAGE_NAME}\"|" project/app/build.gradle
          sed -i "s|versionCode 1|versionCode ${VERSION_CODE}|" project/app/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"${VERSION_NAME}\"|" project/app/build.gradle

          if [ ! -f build-assets/icon.png ] || ! file build-assets/icon.png | grep -q PNG; then
            echo "⚠️ Icon tidak valid, membuat default..."
            mkdir -p build-assets
            convert -size 512x512 xc:blue build-assets/icon.png
          fi
          for dpi in "hdpi:72" "mdpi:48" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            name="${dpi%%:*}"; size="${dpi##*:}"
            mkdir -p "project/app/src/main/res/mipmap-$name"
            convert build-assets/icon.png -resize "${size}x${size}" "project/app/src/main/res/mipmap-$name/ic_launcher.png"
            cp "project/app/src/main/res/mipmap-$name/ic_launcher.png" "project/app/src/main/res/mipmap-$name/ic_launcher_round.png"
          done
          rm -f project/app/debug.keystore
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Web2APK - Build
        if: env.PROJECT_TYPE == 'web2apk'
        run: |
          set -e
          cd project
          gradle assembleRelease --no-daemon --stacktrace

      # ============================================================
      # 4C. FLUTTER BUILD (butuh flutter-project.zip)
      # ============================================================
      - name: Prepare Flutter project
        if: env.PROJECT_TYPE == 'flutter'
        run: |
          set -e
          if [ ! -f flutter-project.zip ]; then
            echo "❌ flutter-project.zip tidak ditemukan di root repo"; exit 1
          fi
          rm -rf flutter-project && mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project

          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project && mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
          fi

          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "❌ pubspec.yaml tidak ditemukan setelah unzip"; exit 1
          fi

      - name: Detect Flutter version from pubspec
        if: env.PROJECT_TYPE == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUBSPEC="flutter-project/pubspec.yaml"
          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          echo "Detected SDK constraint: $SDK_LINE"

          FLUTTER_VERSION="3.27.0"
          DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || true)
          echo "Extracted Dart version: $DART_VERSION"

          if [ -n "$DART_VERSION" ]; then
            case "$DART_VERSION" in
              3.9*|3.10*|3.11*|3.12*|3.13*|3.14*|3.15*) FLUTTER_VERSION="3.35.2" ;;
              3.8*)  FLUTTER_VERSION="3.35.2" ;;
              3.7*)  FLUTTER_VERSION="3.29.0" ;;
              3.6*)  FLUTTER_VERSION="3.27.0" ;;
              3.5*)  FLUTTER_VERSION="3.24.0" ;;
              3.4*)  FLUTTER_VERSION="3.22.0" ;;
              3.3*)  FLUTTER_VERSION="3.19.0" ;;
              3.2*)  FLUTTER_VERSION="3.16.0" ;;
              3.1*)  FLUTTER_VERSION="3.13.0" ;;
              3.0*)  FLUTTER_VERSION="3.10.0" ;;
              *)     FLUTTER_VERSION="3.27.0" ;;
            esac
          fi

          # Override untuk paket modern
          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?(4\.(1[5-9]|[2-9][0-9])|5\.)' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'geolocator:[[:space:]]*(\^|>=)?(14\.|15\.)' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?(2\.(1[0-9]|[2-9][0-9])|3\.)' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'firebase_(core|[a-z_]+):[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'flutter_local_notifications:[[:space:]]*(\^|>=)?17\.' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'workmanager:[[:space:]]*(\^|>=)?0\.(6|[7-9])' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9][0-9])' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'file_picker:[[:space:]]*(\^|>=)?8\.' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi
          if grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?12\.' "$PUBSPEC"; then FLUTTER_VERSION="3.35.2"; fi

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "Using Flutter $FLUTTER_VERSION"

      - name: Setup Flutter SDK
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter APK (auto-fix retry)
        if: env.PROJECT_TYPE == 'flutter'
        shell: bash
        run: |
          set -e
          cd flutter-project
          flutter --version

          PUB_LOG="../pubget.log"
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          try_pub_get() { flutter pub get 2>&1 | tee "$PUB_LOG"; return ${PIPESTATUS[0]}; }

          auto_fix_pubspec() {
            local FIXED=false
            echo "=== Auto-fixing pubspec.yaml ==="
            if grep -qE "requires (Dart )?SDK version" "$PUB_LOG"; then
              echo "Fix: SDK constraint"
              sed -i -E "s/sdk:[[:space:]]*['\"]?[\^>=]*3\.[0-9]+(\.[0-9]+)?['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "webview_flutter" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/webview_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/webview_flutter: ^4.13.0/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "geolocator" "$PUB_LOG" && (grep -q "toARGB32" "$PUB_LOG" || grep -q "geolocator_android" "$PUB_LOG"); then
              sed -i -E "s/geolocator:[[:space:]]*['\"]?[^'\"]+['\"]?/geolocator: ^13.0.4/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "google_maps_flutter" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/google_maps_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/google_maps_flutter: ^2.9.0/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "permission_handler" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/permission_handler:[[:space:]]*['\"]?[^'\"]+['\"]?/permission_handler: ^11.3.1/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "firebase_core" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/firebase_core:[[:space:]]*['\"]?[^'\"]+['\"]?/firebase_core: ^2.32.0/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "file_picker" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/file_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/file_picker: ^6.2.1/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "image_picker" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/image_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/image_picker: ^1.1.2/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "flutter_local_notifications" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/flutter_local_notifications:[[:space:]]*['\"]?[^'\"]+['\"]?/flutter_local_notifications: ^17.2.4/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "workmanager" "$PUB_LOG" && grep -q "SDK version" "$PUB_LOG"; then
              sed -i -E "s/workmanager:[[:space:]]*['\"]?[^'\"]+['\"]?/workmanager: ^0.5.2/g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "overrides" "$PUB_LOG"; then
              sed -i '/^dependency_overrides:/,/^[^ ]/d' pubspec.yaml || true
              FIXED=true
            fi
            [ "$FIXED" = true ] && rm -f pubspec.lock
          }

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Attempt $RETRY_COUNT / $MAX_RETRIES ==="
            if try_pub_get; then
              if [ "${BUILD_TYPE}" = "release" ]; then
                if flutter build apk --release; then SUCCESS=true; break; fi
              else
                if flutter build apk --debug; then SUCCESS=true; break; fi
              fi
              echo "❌ Build gagal, mencoba auto-fix..."
              auto_fix_pubspec
              rm -rf build .dart_tool
            else
              echo "❌ pub get gagal, mencoba auto-fix..."
              auto_fix_pubspec
              rm -f pubspec.lock
            fi
          done
          [ "$SUCCESS" = false ] && { echo "❌ Gagal setelah $MAX_RETRIES percobaan"; cat "$PUB_LOG" || true; exit 1; }

      # ============================================================
      # 5. SIGN APK (release, semua tipe)
      # ============================================================
      - name: Sign APK (release)
        if: env.BUILD_TYPE == 'release'
        run: |
          set +e
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          found=0
          for f in \
            $(find project/app/build/outputs/apk/release -name "*.apk" 2>/dev/null) \
            $(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null) \
            $(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null); do
            echo "Signing: $f"
            "$APKSIGNER" sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$f" || true
            "$APKSIGNER" verify "$f" || true
            found=$((found + 1))
          done
          echo "APK ditandatangani: $found file"

      # ============================================================
      # 6. COLLECT OUTPUT
      # ============================================================
      - name: Collect output APKs
        run: |
          set -e
          mkdir -p output
          find project/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            cp "$f" "output/${APP_NAME}_v${VERSION_NAME}_${BUILD_TYPE}_web2apk.apk"
          done
          find flutter-project/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | while read f; do
            cp "$f" "output/${APP_NAME}_v${VERSION_NAME}_${BUILD_TYPE}_flutter.apk"
          done
          find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            cp "$f" "output/${APP_NAME}_v${VERSION_NAME}_${BUILD_TYPE}_native.apk"
          done
          ls -lh output/
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "❌ Tidak ada APK yang dihasilkan"; exit 1
          fi

      # ============================================================
      # 7. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.VERSION_NAME }}-${{ env.BUILD_TYPE }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error

      # ============================================================
      # 8. NOTIFY SUCCESS (Telegram, opsional)
      # ============================================================
      - name: Send APK to Telegram
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          set +e
          for APK in output/*.apk; do
            [ -f "$APK" ] || continue
            SIZE=$(du -sh "$APK" | cut -f1)
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${APK}" \
              -F "parse_mode=HTML" \
              -F "caption=✅ <b>Build Selesai!</b>

          🏷️ <b>App:</b> ${APP_NAME}
          📦 <b>Package:</b> <code>${PACKAGE_NAME}</code>
          🔢 <b>Versi:</b> <code>${VERSION_NAME}</code> (code: ${VERSION_CODE})
          🔨 <b>Tipe:</b> <code>${BUILD_TYPE}</code>
          🧩 <b>Jenis:</b> <code>${PROJECT_TYPE}</code>
          📁 <b>Size:</b> <code>${SIZE}</code>

          ⚡ by @Zyvarno1" || true
          done

      # ============================================================
      # 9. NOTIFY FAILURE (Telegram, opsional)
      # ============================================================
      - name: Notify Failure
        if: failure() && env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>Build Gagal!</b>

          🏷️ App: <code>${APP_NAME}</code>
          📦 Package: <code>${PACKAGE_NAME}</code>
          🧩 Jenis: <code>${PROJECT_TYPE}</code>

          🔗 https://github.com/${{ github.repository }}/actions" || true

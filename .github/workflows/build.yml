# ============================================================
#  BUILD.YAML - FLUTTER APK BUILDER (OPTIMIZED)
#  PROSES BUILD 5-8 MENIT
# ============================================================

name: 🚀 Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: '📥 Download URL (ZIP file)'
        required: true
        type: string
      tag:
        description: '🏷️ Build Tag'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write

    steps:
      # ============================================================
      # STEP 1: CHECKOUT
      # ============================================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: SETUP FLUTTER (CACHE UNTUK CEPAT)
      # ============================================================
      - name: 🔧 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: 📦 Flutter Doctor
        run: flutter doctor -v

      # ============================================================
      # STEP 3: SETUP JAVA & ANDROID
      # ============================================================
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # STEP 4: INSTALL DEPENDENCIES (CACHE UNTUK CEPAT)
      # ============================================================
      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            project/.dart_tool
            project/build
          key: ${{ runner.os }}-pub-${{ hashFiles('project/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq unzip curl wget

      # ============================================================
      # STEP 5: DOWNLOAD PROJECT ZIP (CARA CEPAT)
      # ============================================================
      - name: 📥 Download Project ZIP
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 Downloading from: ${{ inputs.release_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Download dengan retry 3x
          for i in 1 2 3; do
            echo "⬇️ Attempt $i/3..."
            curl -L --connect-timeout 30 --max-time 120 -o project.zip "${{ inputs.release_url }}" || true
            
            if [ -f "project.zip" ] && [ -s "project.zip" ]; then
              FILE_SIZE=$(du -h project.zip | cut -f1)
              echo "✅ Download successful! Size: $FILE_SIZE"
              break
            fi
            
            echo "⚠️ Download failed, retrying in 3 seconds..."
            sleep 3
          done
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ Failed to download project.zip after 3 attempts"
            ls -la
            exit 1
          fi

      # ============================================================
      # STEP 6: EXTRACT PROJECT (CEPAT)
      # ============================================================
      - name: 📂 Extract Project ZIP
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 Extracting project.zip..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          unzip -q project.zip -d project/
          
          # 🔥 FIX: Jika zip berisi 1 folder utama, ratakan isinya
          FIRST_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find project -mindepth 1 -maxdepth 1 | wc -l)
          
          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            echo "📂 Detected single root folder, flattening structure..."
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf project
            mkdir -p project
            cp -R "$TMP_DIR"/. project/
            rm -rf "$TMP_DIR"
          fi
          
          echo "📂 Project files:"
          ls -la project/

      # ============================================================
      # STEP 7: CHECK PROJECT STRUCTURE
      # ============================================================
      - name: 🔍 Check Project Structure
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking Flutter project structure..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ ! -f "project/pubspec.yaml" ]; then
            echo "❌ pubspec.yaml not found!"
            find project -name "pubspec.yaml" -type f | head -5
            exit 1
          fi
          
          echo "✅ pubspec.yaml found"
          echo ""
          echo "📄 pubspec.yaml content:"
          cat project/pubspec.yaml | head -30

      # ============================================================
      # STEP 8: AUTO-FIX PUBSPEC.YAML
      # ============================================================
      - name: 🔧 Auto-Fix pubspec.yaml
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔧 Auto-fixing pubspec.yaml..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd project
          
          # Fix SDK constraint
          sed -i 's/sdk: ">=3.0.0 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          sed -i 's/sdk: ^3.[0-9].[0-9]/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          sed -i 's/sdk: ">=3.[0-9].[0-9] <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          
          # Fix common packages
          sed -i 's/webview_flutter: ^[0-9]*\.[0-9]*\.[0-9]*/webview_flutter: ^4.13.0/g' pubspec.yaml
          sed -i 's/geolocator: ^[0-9]*\.[0-9]*\.[0-9]*/geolocator: ^13.0.4/g' pubspec.yaml
          sed -i 's/google_maps_flutter: ^[0-9]*\.[0-9]*\.[0-9]*/google_maps_flutter: ^2.9.0/g' pubspec.yaml
          sed -i 's/permission_handler: ^[0-9]*\.[0-9]*\.[0-9]*/permission_handler: ^11.3.1/g' pubspec.yaml
          sed -i 's/firebase_core: ^[0-9]*\.[0-9]*\.[0-9]*/firebase_core: ^2.32.0/g' pubspec.yaml
          sed -i 's/file_picker: ^[0-9]*\.[0-9]*\.[0-9]*/file_picker: ^6.2.1/g' pubspec.yaml
          sed -i 's/image_picker: ^[0-9]*\.[0-9]*\.[0-9]*/image_picker: ^1.1.2/g' pubspec.yaml
          
          echo "✅ pubspec.yaml auto-fixed"

      # ============================================================
      # STEP 9: FLUTTER PUB GET (CACHE)
      # ============================================================
      - name: 📦 Flutter Pub Get
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Running flutter pub get..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd project
          
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if flutter pub get; then
              echo "✅ flutter pub get succeeded!"
              break
            fi
            echo "⚠️ flutter pub get failed, retrying..."
            rm -rf pubspec.lock
            sleep 3
          done
          
          echo ""
          echo "📦 Running flutter pub get again to ensure all dependencies..."
          flutter pub get

      # ============================================================
      # STEP 10: BUILD FLUTTER APK (OPTIMASI KECEPATAN)
      # ============================================================
      - name: 🔨 Build Flutter APK (Optimized)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔨 Building Flutter APK (Optimized)..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd project
          
          # 🔥 BUILD DENGAN OPTIMASI KECEPATAN
          flutter build apk --release --no-tree-shake-icons --split-per-abi

      # ============================================================
      # STEP 11: COLLECT APK
      # ============================================================
      - name: 📦 Collect APK
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Collecting APK..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          mkdir -p output
          
          # Cari APK di berbagai lokasi
          APK_PATHS=(
            "project/build/app/outputs/apk/release/app-release.apk"
            "project/build/app/outputs/apk/debug/app-debug.apk"
            "project/build/app/outputs/flutter-apk/app-release.apk"
            "project/build/app/outputs/flutter-apk/app-debug.apk"
            "project/app/build/outputs/apk/release/app-release.apk"
            "project/app/build/outputs/apk/debug/app-debug.apk"
          )
          
          FOUND=false
          for APK_PATH in "${APK_PATHS[@]}"; do
            if [ -f "$APK_PATH" ]; then
              cp "$APK_PATH" "output/app-${{ inputs.tag }}.apk"
              echo "✅ APK found at: $APK_PATH"
              echo "✅ APK saved: app-${{ inputs.tag }}.apk"
              FOUND=true
              break
            fi
          done
          
          if [ "$FOUND" = false ]; then
            echo "❌ APK not found!"
            echo "📂 Searching for APK files..."
            find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
            exit 1
          fi
          
          echo ""
          echo "📂 Output:"
          ls -la output/

      # ============================================================
      # STEP 12: UPLOAD APK ARTIFACT
      # ============================================================
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      # ============================================================
      # STEP 13: NOTIFY SUCCESS
      # ============================================================
      - name: ✅ Notify Success
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    🎉 BUILD SUCCESSFUL 🎉                      ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📱 App: ${{ inputs.tag }}"
          echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ============================================================
      # STEP 14: NOTIFY FAILURE
      # ============================================================
      - name: ❌ Notify Failure
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    ❌ BUILD FAILED ❌                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📱 App: ${{ inputs.tag }}"
          echo "🔗 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

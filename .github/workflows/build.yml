name: 🚀 Build APK - Flutter & Web2APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: '📥 Download URL (ZIP file)'
        required: true
        type: string
      tag:
        description: '🏷️ Build Tag'
        required: true
        type: string
      build_type:
        description: '📱 Build Type'
        required: true
        default: 'flutter'
        type: choice
        options:
          - flutter
          - web2apk
      app_name:
        description: '📱 App Name'
        required: false
        default: 'MyApp'
        type: string
      url:
        description: '🌐 Website URL (for web2apk)'
        required: false
        default: 'https://example.com'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write

    steps:
      # ============================================================
      # STEP 1: CHECKOUT
      # ============================================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: SETUP FLUTTER
      # ============================================================
      - name: 🔧 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: 📦 Flutter Doctor
        run: flutter doctor -v

      # ============================================================
      # STEP 3: SETUP JAVA & ANDROID
      # ============================================================
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # STEP 4: INSTALL DEPENDENCIES
      # ============================================================
      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq unzip curl wget

      - name: 🔧 Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      # ============================================================
      # STEP 5: DOWNLOAD PROJECT ZIP
      # ============================================================
      - name: 📥 Download Project ZIP
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 Downloading from: ${{ inputs.release_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Test URL first
          echo "🔍 Testing URL..."
          curl -I -L "${{ inputs.release_url }}" 2>&1 | head -10 || true
          
          # Download with retry
          for i in 1 2 3 4 5; do
            echo ""
            echo "⬇️ Attempt $i/5..."
            curl -L --connect-timeout 60 --max-time 180 -o project.zip "${{ inputs.release_url }}" || true
            
            if [ -f "project.zip" ] && [ -s "project.zip" ]; then
              FILE_SIZE=$(du -h project.zip | cut -f1)
              echo "✅ Download successful! Size: $FILE_SIZE"
              break
            fi
            
            echo "⚠️ Download failed, retrying in 5 seconds..."
            sleep 5
          done
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ Failed to download project.zip after 5 attempts"
            echo "📂 Current directory contents:"
            ls -la
            exit 1
          fi

      # ============================================================
      # STEP 6: EXTRACT PROJECT
      # ============================================================
      - name: 📂 Extract Project ZIP
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 Extracting project.zip..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          unzip -q project.zip -d project/
          
          # 🔥 FIX: Jika zip berisi 1 folder utama, ratakan isinya
          FIRST_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find project -mindepth 1 -maxdepth 1 | wc -l)
          
          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            echo "📂 Detected single root folder, flattening structure..."
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf project
            mkdir -p project
            cp -R "$TMP_DIR"/. project/
            rm -rf "$TMP_DIR"
          fi
          
          echo ""
          echo "📂 Project files:"
          ls -la project/

      # ============================================================
      # STEP 7: DETECT PROJECT TYPE
      # ============================================================
      - name: 🔍 Detect Project Type
        id: detect
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Detecting project type..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ -f "project/pubspec.yaml" ]; then
            echo "✅ pubspec.yaml found → Flutter project"
            echo "project_type=flutter" >> $GITHUB_OUTPUT
            echo "type=flutter" >> $GITHUB_ENV
          elif [ -f "project/build-config.json" ] || [ -f "project/web_config.json" ]; then
            echo "✅ build-config.json/web_config.json found → Web2APK project"
            echo "project_type=web2apk" >> $GITHUB_OUTPUT
            echo "type=web2apk" >> $GITHUB_ENV
          else
            echo "⚠️ No pubspec.yaml found, using input build_type"
            echo "project_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
            echo "type=${{ inputs.build_type }}" >> $GITHUB_ENV
          fi
          
          echo "📱 Project Type: ${{ env.type }}"

      # ============================================================
      # STEP 8: CHECK PROJECT STRUCTURE
      # ============================================================
      - name: 🔍 Check Project Structure
        if: env.type == 'flutter'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking Flutter project structure..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ ! -f "project/pubspec.yaml" ]; then
            echo "❌ pubspec.yaml not found!"
            echo "📂 Searching for pubspec.yaml..."
            find project -name "pubspec.yaml" -type f | head -5
            exit 1
          fi
          
          echo "✅ pubspec.yaml found"
          echo ""
          echo "📄 pubspec.yaml content:"
          cat project/pubspec.yaml | head -30

      # ============================================================
      # STEP 9: AUTO-FIX PUBSPEC.YAML
      # ============================================================
      - name: 🔧 Auto-Fix pubspec.yaml
        if: env.type == 'flutter'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔧 Auto-fixing pubspec.yaml..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd project
          
          # Fix SDK constraint
          if grep -q "sdk:" pubspec.yaml; then
            echo "📝 Fixing SDK constraint..."
            sed -i 's/sdk: ">=3.0.0 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
            sed -i 's/sdk: ^3.[0-9].[0-9]/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
            sed -i 's/sdk: ">=3.[0-9].[0-9] <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          fi
          
          # Fix version constraints for common packages
          echo "📝 Fixing package versions..."
          sed -i 's/webview_flutter: ^[0-9]*\.[0-9]*\.[0-9]*/webview_flutter: ^4.13.0/g' pubspec.yaml
          sed -i 's/geolocator: ^[0-9]*\.[0-9]*\.[0-9]*/geolocator: ^13.0.4/g' pubspec.yaml
          sed -i 's/google_maps_flutter: ^[0-9]*\.[0-9]*\.[0-9]*/google_maps_flutter: ^2.9.0/g' pubspec.yaml
          sed -i 's/permission_handler: ^[0-9]*\.[0-9]*\.[0-9]*/permission_handler: ^11.3.1/g' pubspec.yaml
          sed -i 's/firebase_core: ^[0-9]*\.[0-9]*\.[0-9]*/firebase_core: ^2.32.0/g' pubspec.yaml
          sed -i 's/file_picker: ^[0-9]*\.[0-9]*\.[0-9]*/file_picker: ^6.2.1/g' pubspec.yaml
          sed -i 's/image_picker: ^[0-9]*\.[0-9]*\.[0-9]*/image_picker: ^1.1.2/g' pubspec.yaml
          sed -i 's/flutter_local_notifications: ^[0-9]*\.[0-9]*\.[0-9]*/flutter_local_notifications: ^17.2.4/g' pubspec.yaml
          sed -i 's/workmanager: ^[0-9]*\.[0-9]*\.[0-9]*/workmanager: ^0.5.2/g' pubspec.yaml
          
          echo "✅ pubspec.yaml auto-fixed"
          echo ""
          echo "📄 Fixed pubspec.yaml:"
          cat pubspec.yaml | grep -E "sdk:|webview_flutter:|geolocator:|firebase_core:" || echo "⚠️ No matching dependencies found"

      # ============================================================
      # STEP 10: SETUP GRADLE
      # ============================================================
      - name: 🔧 Setup Gradle Wrapper
        if: env.type == 'flutter'
        run: |
          if [ ! -f "project/android/gradlew" ]; then
            echo "⚠️ gradlew not found, creating..."
            cd project/android
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            chmod +x gradlew
            cd ../..
          else
            chmod +x project/android/gradlew
          fi

      # ============================================================
      # STEP 11: FLUTTER PUB GET
      # ============================================================
      - name: 📦 Flutter Pub Get
        if: env.type == 'flutter'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Running flutter pub get..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd project
          
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if flutter pub get; then
              echo "✅ flutter pub get succeeded!"
              break
            fi
            echo "⚠️ flutter pub get failed, retrying in 5 seconds..."
            rm -rf pubspec.lock
            sleep 5
          done
          
          # Second attempt to ensure all dependencies
          echo ""
          echo "📦 Running flutter pub get again to ensure all dependencies..."
          flutter pub get

      # ============================================================
      # STEP 12: BUILD FLUTTER APK
      # ============================================================
      - name: 🔨 Build Flutter APK
        if: env.type == 'flutter'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔨 Building Flutter APK..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd project
          
          if flutter build apk --release --no-tree-shake-icons; then
            echo "✅ Build successful!"
          else
            echo "⚠️ Build failed, trying with --no-sound-null-safety..."
            flutter build apk --release --no-tree-shake-icons --no-sound-null-safety
          fi

      # ============================================================
      # STEP 13: COLLECT APK
      # ============================================================
      - name: 📦 Collect APK
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Collecting APK..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          mkdir -p output
          
          # Cari APK di berbagai lokasi
          APK_PATHS=(
            "project/build/app/outputs/apk/release/app-release.apk"
            "project/build/app/outputs/apk/debug/app-debug.apk"
            "project/build/app/outputs/flutter-apk/app-release.apk"
            "project/build/app/outputs/flutter-apk/app-debug.apk"
            "project/app/build/outputs/apk/release/app-release.apk"
            "project/app/build/outputs/apk/debug/app-debug.apk"
          )
          
          FOUND=false
          for APK_PATH in "${APK_PATHS[@]}"; do
            if [ -f "$APK_PATH" ]; then
              cp "$APK_PATH" "output/app-${{ inputs.tag }}.apk"
              echo "✅ APK found at: $APK_PATH"
              echo "✅ APK saved: app-${{ inputs.tag }}.apk"
              FOUND=true
              break
            fi
          done
          
          if [ "$FOUND" = false ]; then
            echo "❌ APK not found!"
            echo "📂 Searching for APK files..."
            find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
            exit 1
          fi
          
          echo ""
          echo "📂 Output:"
          ls -la output/

      # ============================================================
      # STEP 14: UPLOAD APK
      # ============================================================
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 7

      # ============================================================
      # STEP 15: NOTIFY SUCCESS
      # ============================================================
      - name: ✅ Notify Success
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    🎉 BUILD SUCCESSFUL 🎉                      ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📱 App: ${{ inputs.app_name }}"
          echo "🏷️ Tag: ${{ inputs.tag }}"
          echo "📦 APK available in artifacts"
          echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ============================================================
      # STEP 16: NOTIFY FAILURE
      # ============================================================
      - name: ❌ Notify Failure
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    ❌ BUILD FAILED ❌                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📱 App: ${{ inputs.app_name }}"
          echo "🏷️ Tag: ${{ inputs.tag }}"
          echo "🔗 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
